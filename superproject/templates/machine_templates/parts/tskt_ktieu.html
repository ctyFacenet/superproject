<div class="machine-row">
	<div class="machine-block">
		<h3 class="block-title">Thông số kỹ thuật tức thời</h3>

		<div class="machine-row">
			<div class="machine-card">
				<div class="label">Tốc độ DV</div>
				<div class="value green">{{ data.dv_speed }} RPM</div>
			</div>

			<div class="machine-card">
				<div class="label">Tốc độ KV</div>
				<div class="value green">{{ data.kv_speed }} M/MIN</div>
			</div>

			<div class="machine-card">
				<div class="label">Nhiệt độ dầu</div>
				<div class="value green">{{ data.temperature_oil }}°C</div>
			</div>
		</div>
	</div>
</div>
